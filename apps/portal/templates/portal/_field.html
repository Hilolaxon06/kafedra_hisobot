<div class="field{% if field.errors %} has-error{% endif %}{% if field.widget_type == 'checkbox' %} checkbox{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span style="color:var(--bad)">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
  {{ field.errors }}
</div>
